services:
  api:
    build:
      context: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_PATH: "/data/tasks.db"
    volumes:
      - task-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  task-data:
